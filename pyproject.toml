[project]
name = "instruction-order-study"
version = "0.1.0"
description = "Instruction-order sensitivity in small open-weight language models: evaluation set, generation package, evaluators and analysis."
requires-python = ">=3.10"
readme = "README.md"
# Pinned dependencies live in requirements.txt (local) and requirements-colab.txt (Colab generation).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "data: needs the cached source datasets (downloaded from the Hugging Face Hub on first use)",
]
